name: Deploy EdgeEver to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: edgeever-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy EdgeEver
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: "5634fc2935c1d7f96bfbd722784201b1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EDGE_EVER_WORKER_NAME: "edgeever"
      EDGE_EVER_D1_DATABASE_NAME: "edgeever"
      EDGE_EVER_D1_DATABASE_ID: "41c2643d-801e-464f-8c3c-26766c9a2185"
      EDGE_EVER_R2_BUCKET_NAME: "edgeever-resources"
      EDGE_EVER_R2_PREVIEW_BUCKET_NAME: "edgeever-resources-preview"
      EDGE_EVER_AUTH_USERNAME: "stormKB"
      EDGE_EVER_AUTH_PASSWORD: ${{ secrets.EDGE_EVER_AUTH_PASSWORD }}
      EDGE_EVER_USE_EXISTING_AUTH_SECRET: "true"
      EDGE_EVER_DEPLOYMENT_METHOD: "github_actions"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile; then
              exit 0
            fi
            sleep "$((15 * attempt))"
          done
          bun install

      - name: Deploy Worker
        run: bun run deploy
